<svg width="1600" height="400" viewBox="0 0 1600 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Hermes Agents</title>
  <desc id="desc">Hero banner for Awesome Hermes Agents list - GenCreator 6-Pillar CoE</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="400">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="100" x2="1600" y2="300">
      <stop stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#00a8cc"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" fill="url(#bgGrad)" rx="12"/>
  <!-- Decorative elements - constellation style with teal accents -->
  <g stroke="#00d4ff" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="80" x2="400" y2="120"/>
    <line x1="400" y1="120" x2="650" y2="90"/>
    <line x1="650" y1="90" x2="900" y2="140"/>
    <circle cx="200" cy="80" r="4" fill="#00d4ff"/>
    <circle cx="400" cy="120" r="4" fill="#00d4ff"/>
    <circle cx="650" cy="90" r="4" fill="#00d4ff"/>
    <circle cx="900" cy="140" r="4" fill="#00d4ff"/>
    <!-- right side -->
    <line x1="1100" y1="100" x2="1300" y2="80"/>
    <line x1="1300" y1="80" x2="1450" y2="130"/>
    <circle cx="1100" cy="100" r="4" fill="#00d4ff"/>
    <circle cx="1300" cy="80" r="4" fill="#00d4ff"/>
    <circle cx="1450" cy="130" r="4" fill="#00d4ff"/>
  </g>
  <!-- Main title text -->
  <text x="800" y="180" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" text-anchor="middle" letter-spacing="-1">Awesome Hermes Agents</text>
  <text x="800" y="230" fill="#00d4ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="1">| GenCreator 6-Pillar</text>
  <text x="800" y="280" fill="#a0a0b0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">Curated through the GenCreator 6-Pillar CoE lens • Starlight Swarm • Arcanea Creative Execution • Agentic Passive Income Systems</text>
  <!-- Bottom accent line -->
  <rect x="300" y="320" width="1000" height="2" fill="#00d4ff" opacity="0.4"/>
</svg>