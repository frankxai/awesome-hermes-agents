<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Hermes Agents</title>
  <desc id="desc">A GitHub README hero banner for Hermes Agent resources and operator patterns.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500">
      <stop stop-color="#071014"/>
      <stop offset="0.45" stop-color="#0A1C23"/>
      <stop offset="1" stop-color="#162616"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="120" x2="1390" y2="390">
      <stop stop-color="#66D9EF"/>
      <stop offset="0.5" stop-color="#40C4AA"/>
      <stop offset="1" stop-color="#D7FF8A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="500" rx="28" fill="url(#bg)"/>
  <g opacity="0.22">
