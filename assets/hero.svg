    <path d="M864 164H1386V374H864V164Z"/>
    <path d="M920 224H1032M920 274H1118M920 324H1068"/>
    <path d="M1168 224H1290M1168 274H1350M1168 324H1270"/>
    <path d="M750 250H864M1386 250H1490"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="750" cy="250" r="18" fill="#66D9EF"/>
    <circle cx="864" cy="250" r="10" fill="#40C4AA"/>
    <circle cx="1386" cy="250" r="10" fill="#D7FF8A"/>
    <circle cx="1490" cy="250" r="18" fill="#40C4AA"/>
  </g>
  <g fill="#102A2F" stroke="#B8F7E0" stroke-width="1.6">
    <rect x="888" y="194" width="210" height="52" rx="12"/>
    <rect x="888" y="294" width="210" height="52" rx="12"/>
    <rect x="1140" y="194" width="210" height="52" rx="12"/>
