  <text x="112" y="314" fill="#B8F7E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0">Agents</text>
  <text x="114" y="370" fill="#D8E8E3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="0">Operator guides, profile patterns, deployment notes, and Starlight composition</text>
